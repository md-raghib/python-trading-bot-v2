services:
  bot:
    build: .
    container_name: rsi-ema-paper-bot
    restart: unless-stopped        # crashed or rebooted? it comes back by itself
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./state:/app/state         # open paper positions survive restarts
      - ./logs:/app/logs
